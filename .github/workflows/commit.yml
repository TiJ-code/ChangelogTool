name: commit.yml
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  commit:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download dev-tool via GitHub API
        shell: bash
        run: |
          REPO="TiJ-code/ChangelogTool"
          API="https://api.github.com/repos/$REPO/releases/latest"

          AUTH_HEADER=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          echo "Fetching release metadata for tag: $TAG"

          JSON=$(curl -sSL "${AUTH_HEADER[@]}" "$API")

          download_asset () {
            local NAME="$1"

            ID=$(echo "$JSON" | jq -r ".assets[] | select(.name==\"$NAME\") | .id")

            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "Asset not found: $NAME"
              exit 1
            fi

            echo "Downloading $NAME (asset id: $ID)"

            curl -sSL \
              "${AUTH_HEADER[@]}" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$REPO/releases/assets/$ID" \
              -o "$NAME"
          }

          download_asset "ChangelogVersioning.tool"
          chmod +x *.tool

      - name: Bump
        run: |
          CONFIG=config_changelog_tool.xml
          ./ChangelogVersioning.tool "$CONFIG" --increment ${{ github.event.inputs.bump }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          git commit -m "[ACTION] prepare next phase"
          git push origin ${{ github.ref_name }}
