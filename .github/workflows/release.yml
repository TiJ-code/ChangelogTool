name: Release
on:
  workflow_dispatch:
    inputs:
      next-type:
        description: Next version
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major


jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup GraalVM
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: 25
          cache: maven

      - name: Build JARs
        shell: bash
        run: mvn -B clean package

      - name: Collect native tools
        run: |
          cp patches/target/ChangelogPatchParser.tool .
          cp markdown/target/ChangelogMarkdownBuilder.tool .
          cp archive/target/ChangelogArchiver.tool .
          cp versioning/target/ChangelogVersioning.tool .

      - name: Make tools executable
        shell: bash
        run: |
          chmod +x ChangelogVersioning.tool
          chmod +x ChangelogPatchParser.tool
          chmod +x ChangelogMarkdownBuilder.tool
          chmod +x ChangelogArchiver.tool

      - name: Release Version Bump
        shell: bash
        run: ./ChangelogVersioning.tool config_changelog_tool.xml --release

      - name: Generate Changelog Patch
        shell: bash
        run: ./ChangelogPatchParser.tool config_changelog_tool.xml

      - name: Generate Changelog File
        shell: bash
        run: ./ChangelogMarkdownBuilder.tool config_changelog_tool.xml

      - name: Archive Changelog Files
        shell: bash
        run: ./ChangelogArchiver.tool

      - name: Get Version
        id: version
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "[ACTION] Release ${{ steps.version.outputs.version }}"
          git tag "releases/${{ steps.version.outputs.version }}"
          git push

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: releases/${{ steps.version.outputs.version }}
          files: Changelog*.tool
          body_path: changelogs/CHANGELOG.md
          make_latest: true
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true

      - name: Next Dev Version Bump
        shell: bash
        run: |
          ./ChangelogVersioning.tool config_changelog_tool.xml --stage ${{ inputs.next-type }}
          ./ChangelogVersioning.tool config_changelog_tool.xml --suffix

      - name: Commit
        shell: bash
        run: |
          git add .
          git commit -m "[ACTION] prepare next phase"
          git push
